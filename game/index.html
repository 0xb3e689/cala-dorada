<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALA DORADA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff8a4c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="game-canvas" aria-label="Cala Dorada open-world 3D action game"></canvas>

  <!-- World-Space Projected Combat Layer (Enemy Threat Markers, HP Bars & Floating Weapon Damage Numbers) -->
  <div id="combat-world-layer" class="combat-world-layer hidden" aria-hidden="true"></div>

  <!-- Red Screen-Edge Damage Flash Vignette -->
  <div id="damage-flash" class="damage-flash hidden" aria-hidden="true"></div>

  <!-- Blue-Teal Underwater Diving Screen Tint (shown ONLY while diving underwater) -->
  <div id="underwater-tint" class="underwater-tint hidden" aria-hidden="true"></div>

  <!-- Fullscreen GTA WASTED / BUSTED Overlay -->
  <div id="status-overlay" class="status-overlay hidden" aria-live="assertive"></div>

  <!-- Screen-Center Aiming Reticle with Hit-Confirm Crosshair & Reload Ring (Exact 50%, 50%) -->
  <div id="reticle" class="reticle hidden" aria-hidden="true">
    <svg id="reticle-reload-svg" class="reticle-reload-svg hidden" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.6"/>
      <circle id="reticle-reload-arc" cx="20" cy="20" r="17" fill="none" stroke="#ffbe55" stroke-width="2.8"
        stroke-dasharray="106.8" stroke-dashoffset="106.8" stroke-linecap="round" transform="rotate(-90 20 20)"/>
    </svg>
    <div class="reticle-ring"></div>
    <div class="reticle-dot"></div>
    <div class="reticle-tick t-top"></div>
    <div class="reticle-tick t-bottom"></div>
    <div class="reticle-tick t-left"></div>
    <div class="reticle-tick t-right"></div>
    <div class="hit-x hx-tl"></div>
    <div class="hit-x hx-tr"></div>
    <div class="hit-x hx-bl"></div>
    <div class="hit-x hx-br"></div>
  </div>

  <!-- CS:GO-Style Radial Weapon Select Wheel -->
  <div id="weapon-wheel" class="weapon-wheel hidden" aria-hidden="true"></div>

  <!-- Pure GTA-Style Minimal Gameplay HUD -->
  <div id="hud-root" class="hud-root hidden">
    <!-- TOP LEFT: Concise Mission Card (ONLY during an active mission) -->
    <div class="hud-tl">
      <section id="mission-card" class="glass-card mission-card hidden"></section>
    </div>

    <!-- TOP RIGHT: Money, 5 Plain Wanted Stars (ZERO text), Single Active Weapon Badge, Compact Crew HP (only when active) -->
    <div class="hud-tr">
      <section id="status-strip" class="gta-cash-row"></section>
      <section id="wanted-panel" class="wanted-panel"></section>
      <section id="weapon-bar" class="glass-card weapon-active-card"></section>
      <section id="crew-bar" class="crew-bar hidden"></section>
    </div>

    <!-- CENTER TOAST / BAIL OUT / ACTION PROMPT / MINI-GAME BAR -->
    <div id="bailout-banner" class="bailout-banner hidden">BAIL OUT!</div>
    <div id="banner-toast" class="banner-toast hidden"></div>
    <div id="activity-hud" class="glass-card activity-hud hidden"></div>
    <div id="interact-prompt" class="interact-prompt hidden"></div>

    <!-- BOTTOM LEFT: Crisp GTA Minimap + Health / Armor / Stamina Bars -->
    <div class="hud-bl">
      <div class="radar-wrap glass-card">
        <canvas id="minimap-canvas" width="212" height="156"></canvas>
      </div>
      <div id="vitals-bar" class="glass-card vitals-bar"></div>
    </div>

    <!-- BOTTOM CENTER: Character Portrait Dialogue -->
    <div id="dialogue-box" class="glass-card dialogue-box hidden"></div>

    <!-- BOTTOM RIGHT: Minimal Radio Name + Clean Speedometer (ONLY while driving) -->
    <div class="hud-br">
      <div id="radio-ticker" class="radio-pill hidden"></div>
      <div id="vehicle-hud" class="glass-card vehicle-hud hidden"></div>
    </div>
  </div>

  <!-- 4-Tab GTA Pause Menu (MAP | STATS | SAVE | SETTINGS) -->
  <div id="career-overlay" class="overlay-backdrop hidden"></div>

  <!-- Pure Clean GTA Title Screen -->
  <div id="title-overlay" class="title-overlay hidden"></div>

  <!-- In-World Property / Garage / Wardrobe / Garden Modal -->
  <div id="shop-overlay" class="overlay-backdrop hidden"></div>

  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
